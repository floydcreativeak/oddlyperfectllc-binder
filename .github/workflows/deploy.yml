# Publishes the site to GitHub Pages (custom domain: see public/CNAME).
# Runs on every push to `main`, or by hand from the Actions tab.
# The "content lint (production)" step refuses to publish while any
# placeholder, TODO or draft leak remains. That's on purpose.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content lint (production)
        run: npm run lint:content:prod
      - name: Build
        run: npm run build
      - name: Check the built pages
        run: node scripts/content-lint.mjs --production --dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Publishes the site to GitHub Pages.
#
# - Every push to `main` runs a LIVE deploy. The content check refuses to
#   publish while any placeholder, TODO or draft leak remains. That's on purpose.
# - "Run workflow" by hand (Actions tab → Deploy to GitHub Pages) with
#   "preview" ticked publishes even with placeholders, hidden from search
#   engines (noindex + robots.txt) and wearing a "Preview" sticker.
#
# The site address comes from Settings → Pages, so it works at the github.io
# project address now and at the custom domain once that's set up there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Preview deploy (allows placeholders, hidden from search engines)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Content lint
        run: |
          if [ "$PREVIEW" = "true" ]; then npm run lint:content; else npm run lint:content:prod; fi
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_PREVIEW: ${{ env.PREVIEW }}
      - name: Check the built pages
        run: |
          if [ "$PREVIEW" = "true" ]; then node scripts/content-lint.mjs --dist; else node scripts/content-lint.mjs --production --dist; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

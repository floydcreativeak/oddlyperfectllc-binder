# Checks every pull request and every branch push (not main, which deploys).
# Placeholders are warnings here, so work in progress can still be previewed:
# download the "site-preview" artifact from the run to look at the build.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content lint
        run: npm run lint:content
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check the built pages
        run: node scripts/content-lint.mjs --dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Pages CMS configuration (https://pagescms.org).
# This turns the files in /content into friendly forms. Field names here must
# match src/content.config.ts. If you add a field there, add it here too.
# ─────────────────────────────────────────────────────────────────────────────

media:
  input: content/media
  output: /content/media
  categories:
    - image
content:
  - name: site
    label: Site settings
    type: file
    path: content/site.yml
    fields:
      - name: name
        label: Business name
        type: string
        required: true
      - name: shortName
        label: Short name
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string
        required: true
      - name: description
        label: Google description (under 170 characters)
        type: text
        required: true
      - name: locale
        label: Language code
        type: string
        hidden: true
      - name: region
        label: Region
        type: string
        required: true
      - name: phone
        label: Phone
        type: object
        fields:
          - name: display
            label: Phone as shown
            type: string
            required: true
            description: (907) 555-1234
          - name: tel
            label: Phone for tapping to call
            type: string
            required: true
            description: "+1 then 10 digits, no spaces: +19075551234"
          - name: placeholder
            label: Still a placeholder
            type: boolean
      - name: email
        label: Email
        type: object
        fields:
          - name: address
            label: Email address
            type: string
            required: true
          - name: placeholder
            label: Still a placeholder
            type: boolean
      - name: hours
        label: Office hours
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: rows
            label: Hours
            type: object
            list: true
            fields:
              - name: days
                label: Days
                type: string
                required: true
              - name: time
                label: Time
                type: string
                required: true
          - name: note
            label: Note under the hours
            type: string
          - name: placeholder
            label: Still a placeholder
            type: boolean
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - facebook
                - instagram
                - linkedin
                - tiktok
                - youtube
                - x
                - threads
                - google
                - yelp
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: Full web address
            type: string
            required: true
          - name: placeholder
            label: Still a placeholder
            type: boolean
      - name: serviceArea
        label: Service area (no travel fee)
        type: string
        list: true
        description: One community per line. Shown on Pricing, FAQ, Contact and in Google data.
      - name: blindDate
        label: The Blind Date (free 30-minute fit call)
        type: object
        fields:
          - name: title
            label: Full title
            type: string
            required: true
          - name: shortTitle
            label: Short title
            type: string
            required: true
          - name: duration
            label: Length
            type: string
            required: true
          - name: blurb
            label: Blurb
            type: text
            required: true
          - name: isNot
            label: What it isn't
            type: text
            required: true
          - name: cta
            label: Button label
            type: string
            required: true
      - name: announcement
        label: Announcement bar
        type: object
        fields:
          - name: enabled
            label: Show the announcement bar
            type: boolean
          - name: text
            label: Message
            type: string
          - name: linkLabel
            label: Link label (optional)
            type: string
          - name: link
            label: Link (optional)
            type: string
            description: A page like /pricing
      - name: analytics
        label: Google Analytics
        type: object
        fields:
          - name: ga4Id
            label: GA4 measurement ID
            type: string
            description: Looks like G-ABC123XYZ. Leave empty to turn analytics off.
          - name: placeholder
            label: Still a placeholder
            type: boolean
      - name: logo
        label: Logo
        type: object
        fields:
          - name: alt
            label: Logo alt text
            type: string
            required: true
          - name: placeholder
            label: Still using the stand-in logo
            type: boolean
      - name: nav
        label: Main menu (max 5)
        type: object
        list:
          max: 5
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: Page
            type: string
            required: true
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - home
                - services
                - pricing
                - reviews
                - about
      - name: legalNav
        label: Legal links (footer)
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: Page
            type: string
            required: true
      - name: microcopy
        label: Little words (buttons, labels)
        type: object
        fields:
          - name: skipLink
            label: Skip link
            type: string
          - name: callLabel
            label: Call button (short)
            type: string
          - name: callLong
            label: Call button (long)
            type: string
          - name: emailLabel
            label: Email button
            type: string
          - name: phoneAria
            label: Screen-reader call label
            type: string
          - name: themeToLight
            label: Theme toggle (to light)
            type: string
          - name: themeToDark
            label: Theme toggle (to dark)
            type: string
          - name: themeAria
            label: Theme toggle (screen reader)
            type: string
          - name: menuLabel
            label: Menu name (screen reader)
            type: string
          - name: tabBarLabel
            label: Bottom tabs name (screen reader)
            type: string
          - name: socialsLabel
            label: Socials heading
            type: string
          - name: loading
            label: Loading text
            type: string
          - name: backToTop
            label: Back to top
            type: string
          - name: previewBadge
            label: Preview sticker (preview deploys only)
            type: string
          - name: previewNote
            label: Preview sticker small print
            type: string
      - name: footer
        label: Footer
        type: object
        fields:
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: signoff
            label: Giant sign-off
            type: string
            required: true
          - name: blurb
            label: Blurb
            type: text
            required: true
          - name: hoursHeading
            label: Hours heading
            type: string
            required: true
          - name: areaHeading
            label: Service area heading
            type: string
            required: true
          - name: areaNote
            label: Service area note
            type: string
          - name: funFacts
            label: Tiny fun-fact notes (max 4)
            type: string
            list:
              max: 4
          - name: easterEgg
            label: Easter egg (paperclip drawer)
            type: object
            fields:
              - name: label
                label: Button label (screen readers)
                type: string
                required: true
              - name: text
                label: Hidden note
                type: text
                required: true
          - name: copyright
            label: Copyright line (year is added automatically)
            type: string
            required: true
          - name: topLabel
            label: Back to top label
            type: string
            required: true
      - name: consent
        label: Analytics question (consent note)
        type: object
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: body
            label: Text
            type: text
            required: true
          - name: accept
            label: Yes button
            type: string
            required: true
          - name: decline
            label: No button
            type: string
            required: true
          - name: settingsLabel
            label: Footer settings link
            type: string
            required: true
          - name: privacyLabel
            label: Privacy link
            type: string
            required: true
      - name: notFound
        label: Page not found (404)
        type: object
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: body
            label: Body
            type: text
            required: true
          - name: homeLabel
            label: Home button
            type: string
            required: true
          - name: callPrompt
            label: Call prompt
            type: string
            required: true
  - name: home
    label: Home page
    type: file
    path: content/home.yml
    fields:
      - name: seo
        label: Google title and description
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: description
            label: Description (under 170 characters)
            type: text
            required: true
      - name: hero
        label: Hero (the whiteboard)
        type: object
        fields:
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: headline
            label: Headline
            type: string
            required: true
            description: Wrap a word in *stars* to underline it with marker.
          - name: subhead
            label: Subhead
            type: text
            required: true
          - name: callNote
            label: Words on the phone sticky note
            type: string
            required: true
          - name: callScribble
            label: Margin scribble
            type: string
          - name: secondaryLabel
            label: Second button label
            type: string
            required: true
          - name: secondaryHref
            label: Second button page
            type: string
            required: true
          - name: photos
            label: Photos taped to the whiteboard (max 3)
            type: object
            list:
              max: 3
            fields:
              - name: src
                label: Photo
                type: image
                required: true
              - name: alt
                label: Alt text
                type: string
                required: true
                description: Describe the photo for people who can't see it.
              - name: caption
                label: Caption (optional)
                type: string
              - name: placeholder
                label: This is a placeholder photo
                type: boolean
                description: Untick once the real photo is in.
      - name: heroTab
        label: Hero index tab label
        type: string
        required: true
      - name: services
        label: Services section
        type: object
        fields:
          - name: tab
            label: Index tab label
            type: string
            required: true
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: heading
            label: Heading
            type: string
            required: true
          - name: blurb
            label: Blurb
            type: text
            required: true
          - &a1
            name: cta
            label: Button label
            type: string
            required: true
          - &a2
            name: ctaHref
            label: Button goes to (e.g. /pricing)
            type: string
            required: true
      - name: pricing
        label: Pricing section
        type: object
        fields:
          - name: tab
            label: Index tab label
            type: string
            required: true
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: heading
            label: Heading
            type: string
            required: true
          - name: blurb
            label: Blurb
            type: text
            required: true
          - *a1
          - *a2
          - name: downloadLabel
            label: Pricing sheet link label
            type: string
            required: true
      - name: blindDate
        label: Blind Date card
        type: object
        fields:
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: heading
            label: Heading
            type: string
            required: true
          - name: note
            label: Small note
            type: string
            required: true
      - name: contact
        label: Contact section (Post-it station)
        type: object
        fields:
          - name: tab
            label: Index tab label
            type: string
            required: true
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: heading
            label: Heading
            type: string
            required: true
          - name: blurb
            label: Blurb
            type: text
            required: true
          - name: callTitle
            label: Call note title
            type: string
            required: true
          - name: callNote
            label: Call note text
            type: string
            required: true
          - name: emailTitle
            label: Email note title
            type: string
            required: true
          - name: emailNote
            label: Email note text
            type: string
            required: true
          - name: hoursTitle
            label: Hours note title
            type: string
            required: true
      - name: about
        label: About section
        type: object
        fields:
          - name: tab
            label: Index tab label
            type: string
            required: true
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Body
            type: text
            required: true
          - name: points
            label: Checklist points (max 4)
            type: string
            list:
              max: 4
          - *a1
          - *a2
      - name: reviews
        label: Reviews section
        type: object
        fields:
          - name: tab
            label: Index tab label
            type: string
            required: true
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: heading
            label: Heading
            type: string
            required: true
          - name: blurb
            label: Blurb
            type: text
            required: true
          - *a1
          - *a2
      - name: faq
        label: FAQ section
        type: object
        fields:
          - name: tab
            label: Index tab label
            type: string
            required: true
  - name: page-about
    label: "Page: About"
    type: file
    path: content/pages/about.md
    format: yaml-frontmatter
    fields:
      - &a3
        name: page
        label: Page type (do not change)
        type: string
        required: true
      - &a4
        name: title
        label: Menu title
        type: string
        required: true
      - &a5
        name: seo
        label: Google title and description
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: description
            label: Description (under 170 characters)
            type: text
            required: true
      - &a6
        name: kicker
        label: Handwritten kicker
        type: string
      - &a7
        name: heading
        label: Page heading
        type: string
        required: true
      - &a8
        name: intro
        label: Intro
        type: text
        required: true
      - name: storyHeading
        label: Story heading
        type: string
        required: true
      - name: body
        label: Story (the "Why Oddly Perfect" text)
        type: rich-text
        options:
          format: markdown
      - name: howKicker
        label: How-it-works kicker
        type: string
      - name: howHeading
        label: How-it-works heading
        type: string
        required: true
      - name: steps
        label: How-it-works steps (written on the whiteboard)
        type: object
        list:
          min: 2
          max: 7
        fields:
          - name: title
            label: Step title
            type: string
            required: true
          - name: text
            label: Step text
            type: text
            required: true
      - name: teamHeading
        label: Team heading
        type: string
        required: true
      - name: teamIntro
        label: Team intro
        type: string
      - name: galleryHeading
        label: Gallery heading
        type: string
        required: true
      - name: galleryIntro
        label: Gallery intro
        type: string
      - name: areaHeading
        label: Service area heading
        type: string
        required: true
      - name: areaBody
        label: Service area text
        type: text
        required: true
      - &a9
        name: ctaHeading
        label: Closing call-to-action heading
        type: string
        required: true
      - &a10
        name: ctaBody
        label: Closing call-to-action text
        type: text
        required: true
  - name: page-services
    label: "Page: Services"
    type: file
    path: content/pages/services.md
    format: yaml-frontmatter
    fields:
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - *a8
      - name: partnershipsKicker
        label: Partnerships kicker
        type: string
      - name: partnershipsHeading
        label: Partnerships heading
        type: string
        required: true
      - name: partnershipsBlurb
        label: Partnerships blurb
        type: text
        required: true
      - name: projectsKicker
        label: Projects kicker
        type: string
      - name: projectsHeading
        label: Projects heading
        type: string
        required: true
      - name: projectsBlurb
        label: Projects blurb
        type: text
        required: true
      - name: eventsKicker
        label: Events kicker
        type: string
      - name: eventsHeading
        label: Events heading
        type: string
        required: true
      - name: priceLabel
        label: Price label
        type: string
        required: true
      - name: flexPriceNote
        label: Flex price note
        type: string
        required: true
      - name: seeIncludedLabel
        label: "\"What's inside\" label"
        type: string
        required: true
      - name: seePricingLabel
        label: Pricing link label
        type: string
        required: true
      - *a9
      - *a10
  - name: page-reviews
    label: "Page: Reviews"
    type: file
    path: content/pages/reviews.md
    format: yaml-frontmatter
    fields:
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - *a8
      - name: emptyTitle
        label: Empty board title
        type: string
        required: true
      - name: emptyBody
        label: Empty board text
        type: text
        required: true
      - name: emptyNote
        label: Empty board note
        type: string
        required: true
      - name: emptyCta
        label: Empty board button
        type: string
        required: true
      - name: sourceLabels
        label: Review source labels
        type: object
        fields:
          - name: email
            label: Email
            type: string
            required: true
          - name: message
            label: Message
            type: string
            required: true
          - name: yelp
            label: Yelp
            type: string
            required: true
          - name: facebook
            label: Facebook
            type: string
            required: true
          - name: google
            label: Google
            type: string
            required: true
      - name: starsLabel
        label: Stars label (keep {n})
        type: string
        required: true
      - name: dragHint
        label: Drag hint
        type: string
        required: true
      - name: keyboardHint
        label: Keyboard hint
        type: string
        required: true
      - name: listLabel
        label: List label
        type: string
        required: true
      - name: resetLabel
        label: Reset button
        type: string
        required: true
      - *a9
      - *a10
  - name: page-pricing
    label: "Page: Pricing (words only; prices live in Pricing)"
    type: file
    path: content/pages/pricing.md
    format: yaml-frontmatter
    fields:
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - *a8
      - name: flexToggleLabel
        label: Flex toggle label
        type: string
        required: true
      - name: compareHint
        label: Compare hint
        type: string
        required: true
      - name: includesLabel
        label: Includes label
        type: string
        required: true
      - name: exampleLabel
        label: Example label
        type: string
        required: true
      - name: boundaryLabel
        label: Boundary label
        type: string
        required: true
      - name: feesHeading
        label: Fees heading
        type: string
        required: true
      - name: feesKicker
        label: Fees kicker
        type: string
      - name: rushHeading
        label: Rush heading
        type: string
        required: true
      - name: rushKicker
        label: Rush kicker
        type: string
      - name: rushMinimumLabel
        label: Rush minimum label
        type: string
        required: true
      - name: surchargeLabel
        label: Surcharge label
        type: string
        required: true
      - name: houseRulesKicker
        label: House rules kicker
        type: string
      - name: downloadHeading
        label: Download heading
        type: string
        required: true
      - name: downloadBody
        label: Download text
        type: text
        required: true
      - name: downloadLabel
        label: Download button
        type: string
        required: true
      - name: policiesNote
        label: Policies note
        type: text
        required: true
      - *a9
      - *a10
  - name: page-privacy
    label: "Page: Privacy"
    type: file
    path: content/pages/privacy.md
    format: yaml-frontmatter
    fields:
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - *a8
      - name: updated
        label: Last updated
        type: date
        required: true
      - name: body
        label: Page text
        type: rich-text
        options:
          format: markdown
  - name: page-terms
    label: "Page: Terms"
    type: file
    path: content/pages/terms.md
    format: yaml-frontmatter
    fields:
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - *a8
      - name: updated
        label: Last updated
        type: date
        required: true
      - name: body
        label: Page text
        type: rich-text
        options:
          format: markdown
  - name: page-accessibility
    label: "Page: Accessibility"
    type: file
    path: content/pages/accessibility.md
    format: yaml-frontmatter
    fields:
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - *a8
      - name: updated
        label: Last updated
        type: date
        required: true
      - name: body
        label: Page text
        type: rich-text
        options:
          format: markdown
  - name: gallery
    label: Gallery (About page photos)
    type: file
    path: content/gallery.yml
    fields:
      - name: items
        label: Photos
        type: object
        list: true
        fields:
          - name: src
            label: Photo
            type: image
            required: true
          - name: alt
            label: Alt text
            type: string
            required: true
            description: Describe the photo for people who can't see it.
          - name: caption
            label: Caption (optional)
            type: string
          - name: placeholder
            label: This is a placeholder photo
            type: boolean
            description: Untick once the real photo is in.
  - name: stickers
    label: Stickers
    type: file
    path: content/stickers.yml
    fields:
      - name: items
        label: Stickers
        type: object
        list: true
        fields:
          - name: id
            label: Short id
            type: string
            required: true
          - name: text
            label: Sticker text
            type: string
            required: true
          - name: emoji
            label: Emoji artwork (optional, stickers only)
            type: string
            description: Paste one emoji. Shown as a bundled image on the sticker, never in text.
          - name: label
            label: What a screen reader hears
            type: string
            required: true
          - name: decorative
            label: Decorative (screen readers skip it)
            type: boolean
          - name: color
            label: Color
            type: select
            options:
              values:
                - coral
                - butter
                - rose
                - sage
                - sky
  - name: pricing
    label: Pricing
    type: file
    path: content/pricing.yml
    fields:
      - name: currency
        type: string
        hidden: true
      - name: partnershipsIntro
        label: Monthly partnerships, intro
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: kicker
            label: Handwritten kicker
            type: string
          - name: blurb
            label: Blurb
            type: text
          - name: flexLabel
            label: Flex toggle label
            type: string
            required: true
          - name: monthlyLabel
            label: Month-to-month toggle label
            type: string
            required: true
          - name: perMonth
            label: Per-month suffix
            type: string
            required: true
          - name: highlightSticker
            label: Sticker on the highlighted package
            type: string
            required: true
      - name: partnerships
        label: Monthly partnerships (exactly 3)
        type: object
        list:
          min: 3
          max: 3
        fields:
          - name: id
            label: Short id (don't change)
            type: string
            required: true
          - name: name
            label: Package name
            type: string
            required: true
          - name: flexPrice
            label: 12-Month Flex price (per month)
            type: object
            fields:
              - name: amount
                label: Price (number only, no $ or commas)
                type: number
                required: true
              - name: unit
                label: Per
                type: select
                options:
                  values:
                    - value: hr

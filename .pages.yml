  - name: services
    label: Services
    type: collection
    path: content/services
    format: yaml-frontmatter
    view:
      fields:
        - name
        - kind
        - order
      primary: name
      sort:
        - order
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: kind
        label: Kind
        type: select
        required: true
        options:
          values:
            - value: partnership
              label: Monthly partnership
            - value: project
              label: One-time project
            - value: event
              label: Event service
      - name: pricingId
        label: Pricing id (matches an id on the Pricing page)
        type: string
        required: true
      - name: order
        label: Order
        type: number
      - name: fit
        label: Plain-English fit
        type: string
        required: true
      - name: pitch
        label: Witty pitch
        type: text
        required: true
      - name: includes
        label: Extra included items (optional; Pricing list is used if empty)
        type: string
        list: true
      - name: photo
        label: Photo (optional)
        type: object
        fields:
          - name: src
            label: Photo
            type: image
            required: true
          - name: alt
            label: Alt text
            type: string
            required: true
            description: "Describe the photo for people who can't see it. Example: \"Founder laughing at a whiteboard covered in sticky notes\""
          - name: caption
            label: Caption (optional)
            type: string
          - name: placeholder
            label: This is a placeholder photo
            type: boolean
            default: false
            description: Untick once the real photo is in. The live site won't publish while any are ticked.
      - name: draft
        label: Draft (hide from the site)
        type: boolean
      - name: body
        label: Longer description
        type: rich-text
        options:
          format: markdown
